<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>404 - الصفحة غير موجودة | Bagomri</title>
  <meta name="description" content="الصفحة التي تبحث عنها غير موجودة.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg">

  <style>
    .page-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 40px 20px;
      text-align: center;
    }
    .page-404-code {
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 900;
      color: var(--brand);
      opacity: 0.12;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: -20px;
      user-select: none;
    }
    .page-404-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .page-404-title {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
    }
    .page-404-desc {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .page-404-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="page-404">
    <div class="page-404-code">404</div>
    <div class="page-404-icon">🔍</div>
    <h1 class="page-404-title" id="title404">الصفحة غير موجودة</h1>
    <p class="page-404-desc" id="desc404">
      الرابط الذي طلبته غير موجود أو ربما تم نقله إلى مكان آخر.
    </p>
    <div class="page-404-actions">
      <a href="/" class="btn btn-brand" id="homeBtn">الصفحة الرئيسية</a>
      <a href="/blog" class="btn btn-outline" id="blogBtn">المقالات</a>
    </div>
  </div>

  <script src="/js/modules/language.js"></script>
  <script>
    const savedLang = localStorage.getItem('bagomri_lang') || 'ar';
    const isEn = savedLang === 'en';
    if (isEn) {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      document.title = '404 - Page Not Found | Bagomri';
      document.getElementById('title404').textContent = 'Page Not Found';
      document.getElementById('desc404').textContent = 'The link you requested does not exist or may have been moved elsewhere.';
      document.getElementById('homeBtn').textContent = 'Home';
      document.getElementById('blogBtn').textContent = 'Articles';
    }
  </script>
</body>
</html>
